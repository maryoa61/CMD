[package]
name = "mobile-linux-shell"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "HtmlElement",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction",
    "IdbRequest", "IdbOpenDbRequest", "IdbTransactionMode",
    "Request", "RequestInit", "RequestMode", "Response",
    "Headers", "Performance", "Blob", "Url"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
futures = "0.3"
thiserror = "1"
once_cell = "1.19"

[profile.release]
opt-level = "s"
lto = true
